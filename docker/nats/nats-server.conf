# NATS server config (Section 5). Replaces the previous zero-auth
# `-js -sd /data -m 8222` command with:
#   - authentication (per-service accounts/credentials, not a shared token)
#   - subject-level authorization (each account can only publish/subscribe
#     what that service actually needs)
#   - monitoring restricted to loopback (was 0.0.0.0:8222, reachable from
#     the whole flat internal network)
#
# Account design, matching who actually connects (see grep of
# `nats.connect(` across backend/ -- three call sites: the API/workers
# via device_job_service.py + event_bus.py, and the Device Gateway):
#
#   APP account   -- api + all Celery workers (beat/poller/deployer/
#                    firmware/worker/notifier/collector). These all run
#                    the same trusted application code and share the
#                    event_bus JetStream stream, so one account for this
#                    tier is a reasonable boundary -- the meaningful
#                    trust boundary in this system is app-tier vs.
#                    device-gateway-tier, not worker-vs-worker.
#     - publish  jobs.request              (submit a device job)
#     - subscribe jobs.result.>            (only ITS OWN job's result;
#                                            subject includes job_id)
#     - publish  terminal.open             (open an interactive session --
#                                            see app.api.terminal /
#                                            app.schemas.terminal_job)
#     - publish  terminal.session.*.in     (browser keystrokes -- API can
#                                            only publish input for a
#                                            session_id it itself created,
#                                            since that ID is an
#                                            unguessable uuid4 it chose)
#     - subscribe terminal.result.>        (own session's open result)
#     - subscribe terminal.session.*.out   (device output for its own
#                                            sessions)
#     - subscribe terminal.session.*.ctl   (session lifecycle signals)
#     - publish/subscribe netguard.>       (dashboard/alerts/topology/
#                                            notifications UI-refresh events)
#     - $JS.API.>                          (JetStream stream/consumer
#                                            management -- event_bus.py
#                                            lazily creates the
#                                            NETGUARD_EVENTS stream)
#     Deliberately CANNOT publish terminal.session.*.out or .ctl, and
#     CANNOT publish jobs.result.> -- those are the Gateway's exclusive
#     outputs; a compromised API forging a "fake device said this" output
#     message or a fake job/session result is exactly what subject-level
#     ACLs (not just the HMAC signature on the job/session-open envelope)
#     exist to rule out at the transport layer.
#
#   GATEWAY account -- device-gateway only.
#     - subscribe jobs.request
#     - publish  jobs.result.>
#     - subscribe terminal.open
#     - subscribe terminal.session.*.in    (only after the Gateway itself
#                                            opened that session)
#     - publish  terminal.result.>
#     - publish  terminal.session.*.out
#     - publish  terminal.session.*.ctl
#     Deliberately CANNOT publish jobs.request, terminal.open, or
#     terminal.session.*.in, and CANNOT subscribe to netguard.> -- a
#     compromised Gateway has no reason to forge a job/session request
#     back to itself, inject fake browser keystrokes, or push fake
#     dashboard events, so none of those permissions is granted.
#
#   AUDIT account -- reserved for a future audit-event consumer
#     (Section 13). Subscribe-only, on audit.* -- nothing publishes there
#     yet, so this is inert until that consumer exists, but the account
#     and its restricted permission set are defined now so wiring it up
#     later doesn't require another NATS-config change.
#
#   SYS account -- system account, used only for `nats-server`
#     operational commands, not by any NetGuard service.
#
# Passwords come from environment substitution at container start (see
# docker-compose.yaml's `nats` service, which templates this file before
# `nats-server` reads it) -- nothing here is a literal secret.

listen: 0.0.0.0:4222

jetstream {
  store_dir: /data
}

# Monitoring endpoint: bind to localhost only. The previous config
# exposed :8222 to the whole netguard-internal network with no
# restriction; nothing outside this container needs it, so it's no
# longer published in docker-compose.yaml either.
http: 127.0.0.1:8222

accounts: {
  SYS: {
    users: [
      { user: "$NATS_SYS_USER", password: "$NATS_SYS_PASSWORD" }
    ]
  }

  APP: {
    jetstream: enabled
    users: [
      { user: "$NATS_API_USER", password: "$NATS_API_PASSWORD" }
    ]
    exports: []
    permissions: {
      publish: {
        allow: ["jobs.request", "terminal.open", "terminal.session.*.in", "netguard.>", "$JS.API.>"]
      }
      subscribe: {
        allow: [
          "jobs.result.>", "terminal.result.>", "terminal.session.*.out", "terminal.session.*.ctl",
          "netguard.>", "_INBOX.>"
        ]
      }
    }
  }

  GATEWAY: {
    users: [
      { user: "$NATS_GATEWAY_USER", password: "$NATS_GATEWAY_PASSWORD" }
    ]
    permissions: {
      publish: {
        allow: ["jobs.result.>", "terminal.result.>", "terminal.session.*.out", "terminal.session.*.ctl"]
      }
      subscribe: {
        allow: ["jobs.request", "terminal.open", "terminal.session.*.in", "_INBOX.>"]
      }
    }
  }

  AUDIT: {
    users: [
      { user: "$NATS_AUDIT_USER", password: "$NATS_AUDIT_PASSWORD" }
    ]
    permissions: {
      publish: {
        deny: [">"]
      }
      subscribe: {
        allow: ["audit.>"]
      }
    }
  }
}

system_account: SYS

no_auth_user: ""
