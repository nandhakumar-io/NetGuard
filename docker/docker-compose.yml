services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `alembic upgrade head` exactly once, then exits. Every other
  # backend-image service (backend, worker, beat) waits on this one
  # finishing successfully before it starts, instead of each running
  # migrations itself. That's the fix for the `type "driftseverity"
  # already exists` crash: backend and worker used to both run
  # `alembic upgrade head` in their own entrypoints at container start,
  # racing to CREATE TYPE/CREATE TABLE for the same not-yet-existing
  # objects at the same instant. With migrations centralized here, there's
  # only ever one process applying schema changes.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["./entrypoint-migrate.sh"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Runs the deployment pipeline tasks enqueued by POST
    # /change-requests/{id}/approve (see app/tasks.py). `--concurrency`
    # controls how many devices can deploy in parallel per worker process
    # (SRS 6.6); scale by running multiple `worker` replicas for more.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../backend:/app

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Fires the periodic Config Drift Detection sweep (see
    # app.celery_app's beat_schedule / app.tasks.sweep_all_devices_for_drift_task)
    # on its own schedule, independent of deployments. A separate service
    # (rather than folding into `worker`) so there's exactly one beat
    # scheduler regardless of how many worker replicas run.
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  netguard_pgdata:
