# Local dev mode: only Postgres runs in Docker. Backend (FastAPI + Celery
# worker/beat) and frontend (Vite) run natively on the host -- see
# ../LOCAL_DEV.md for the exact commands.
#
# The app also needs Redis (Celery broker/result backend, login rate
# limiter, the /alerts WebSocket pub/sub). It's deliberately NOT
# containerized here per the "only db as a container" setup -- install it
# locally (see LOCAL_DEV.md) or uncomment the block below if you'd rather
# run it in Docker too.
#
# Want everything containerized instead (backend/worker/beat/frontend
# included)? Use docker-compose.full.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Optional: uncomment to also run Redis in Docker instead of installing
  # it locally. Nothing else in this file changes if you do -- the backend
  # you run natively just needs REDIS_URL=redis://localhost:6379/0 either way.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

volumes:
  netguard_pgdata: