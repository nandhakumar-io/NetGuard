services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
      NETGUARD_APP_DB_PASSWORD: ${NETGUARD_APP_DB_PASSWORD:?NETGUARD_APP_DB_PASSWORD
        must be set}
    volumes:
    - netguard_pgdata:/var/lib/postgresql/data
    - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-netguard} -d ${POSTGRES_DB:-netguard}
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
    - /tmp
    - /var/run/postgresql
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-internal
    cap_add:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
    - DAC_OVERRIDE
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: netguard_app
      DB_PASSWORD: ${NETGUARD_APP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-netguard}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '25'
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: '6432'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp
    - /var/run
    # pgbouncer entrypoint writes /etc/pgbouncer/userlist.txt at startup;
    # needs to be tmpfs on a read_only container.
    - /etc/pgbouncer
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-internal
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-internal
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: echo ""
      | base64 -d > /tmp/nats.conf && nats-server -c /tmp/nats.conf
    environment:
      NATS_SYS_USER: ${NATS_SYS_USER:-sys}
      NATS_SYS_PASSWORD: ${NATS_SYS_PASSWORD:?NATS_SYS_PASSWORD must be set}
      NATS_API_USER: ${NATS_API_USER:-api}
      NATS_API_PASSWORD: ${NATS_API_PASSWORD:?NATS_API_PASSWORD must be set}
      NATS_GATEWAY_USER: ${NATS_GATEWAY_USER:-device-gateway}
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:?NATS_GATEWAY_PASSWORD must be
        set}
      NATS_AUDIT_USER: ${NATS_AUDIT_USER:-audit}
      NATS_AUDIT_PASSWORD: ${NATS_AUDIT_PASSWORD:?NATS_AUDIT_PASSWORD must be set}
    volumes:
    - netguard_natsdata:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-internal
    entrypoint:
    - /bin/sh
    - -c
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    restart: unless-stopped
    command:
    - --storageDataPath=/storage
    - --retentionPeriod=90d
    - --httpListenAddr=:8428
    volumes:
    - netguard_vmdata:/storage
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8428/health
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-internal
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD
        must be set}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
    - netguard_grafanadata:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    networks:
    - proxy
    - netguard-internal
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.netguard-grafana.rule=Host(`netguard.notoriousdev.in`)
      && PathPrefix(`/grafana`)
    - traefik.http.routers.netguard-grafana.priority=10
    - traefik.http.services.netguard-grafana.loadbalancer.server.port=3000
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health | grep -q '"database":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  migrate:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    env_file:
    - .env
    - .env.device-gateway
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netguard}
    depends_on:
      db:
        condition: service_healthy
    command:
    - alembic
    - upgrade
    - head
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  api:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
      AUTO_MIGRATE_ON_STARTUP: 'false'
      SNMP_INPROCESS_POLLING_ENABLED: 'false'
      SYSLOG_LISTENER_ENABLED: 'false'
      NETFLOW_LISTENER_ENABLED: 'false'
      SFLOW_LISTENER_ENABLED: 'false'
      TOPOLOGY_SNAPSHOT_ENABLED: 'false'
    volumes:
    - netguard_backups:/app/data/backups
    - netguard_recordings:/app/data/terminal-recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-3}
    networks:
    - proxy
    - netguard-internal
    - netguard-identity
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.netguard-api.rule=Host(`netguard-api.notoriousdev.in`)
    - traefik.http.services.netguard-api.loadbalancer.server.port=8000
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
  openbao:
    image: openbao/openbao:2.0
    restart: unless-stopped
    cap_add:
    - SETUID
    - SETGID
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp
    # Config is embedded as base64 to avoid Docker auto-creating the mount
    # path as an empty directory (same pattern as the `nats` service above).
    # Decode to /tmp/openbao.hcl at startup; /tmp is a tmpfs so the file
    # is never written to the read-only root filesystem.
    entrypoint:
    - /bin/sh
    - -c
    command:
    - echo ""
        | base64 -d > /tmp/openbao.hcl && bao server -config=/tmp/openbao.hcl
    volumes:
    - netguard_openbaodata:/vault/data
    healthcheck:
      # OpenBao always starts sealed (HTTP 503) or uninitialized (HTTP 501).
      # Adding uninitok=true&sealedok=true makes the endpoint return HTTP 200
      # whenever the process is UP and accepting connections, giving Docker a
      # proper liveness signal.  Vault-state checks (is it unsealed?) are the
      # responsibility of the application layer (device-gateway), not the
      # compose healthcheck.
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8200/v1/sys/health?standbyok=true&uninitok=true&sealedok=true
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
    - no-new-privileges:true
    networks:
    - netguard-secrets
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
    - netguard_keycloakdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - netguard-identity
    cap_add:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    tmpfs:
    - /var/run/postgresql
    - /tmp
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Note: --optimized requires a custom image pre-built with `kc.sh build`.
    # The stock quay.io/keycloak image must use plain `start` which builds
    # its configuration on first launch (slower but correct).
    command:
    - start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD
        must be set}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.netguard.notoriousdev.in}
      KC_PROXY: edge
      KC_HTTP_ENABLED: 'true'
    depends_on:
      keycloak-db:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp
    - /opt/keycloak/data/tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    networks:
    - proxy
    - netguard-identity
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.netguard-keycloak.rule=Host(`${KEYCLOAK_HOSTNAME:-netguard-auth.notoriousdev.in}`)
    - traefik.http.services.netguard-keycloak.loadbalancer.server.port=8080
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
  device-gateway:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - python
    - -m
    - app.device_gateway.main
    env_file:
    - .env
    - .env.device-gateway
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      NATS_URL: nats://${NATS_GATEWAY_USER:-device-gateway}:${NATS_GATEWAY_PASSWORD}@nats:4222
      DEVICE_JOB_SIGNING_KEY: ${DEVICE_JOB_SIGNING_KEY:?DEVICE_JOB_SIGNING_KEY must
        be set}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      OPENBAO_MOUNT: netguard-devices
    depends_on:
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
      openbao:
        condition: service_healthy
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
    - netguard-execution
    - netguard-secrets
  collector:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
      AUTO_MIGRATE_ON_STARTUP: 'false'
      SNMP_INPROCESS_POLLING_ENABLED: 'false'
      SYSLOG_LISTENER_ENABLED: 'false'
      NETFLOW_LISTENER_ENABLED: 'false'
      SFLOW_LISTENER_ENABLED: 'false'
      TOPOLOGY_SNAPSHOT_ENABLED: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: 1
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  syslog-collector:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - uvicorn
    - app.collectors.syslog_collector:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      replicas: 1
    ports:
    - 1514:1514/udp
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz',
        timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
  flow-collector:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - uvicorn
    - app.collectors.flow_collector:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      replicas: 1
    ports:
    - 2055:2055/udp
    - 6343:6343/udp
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz',
        timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
  beat:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - beat
    - -S
    - redbeat.RedBeatScheduler
    - --loglevel=info
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: ${BEAT_REPLICAS:-2}
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  poller:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - worker
    - -Q
    - polling
    - --loglevel=info
    - --concurrency=8
    - --hostname=poller@%h
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: ${POLLER_REPLICAS:-1}
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  deployer:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - worker
    - -Q
    - deploy
    - --loglevel=info
    - --concurrency=4
    - --hostname=deployer@%h
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: ${DEPLOYER_REPLICAS:-2}
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  firmware:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - worker
    - -Q
    - firmware
    - --loglevel=info
    - --concurrency=2
    - --hostname=firmware@%h
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: ${FIRMWARE_REPLICAS:-1}
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
