services:
  backend:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - netguard-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netguard-backend.rule=Host(`netguard-api.notoriousdev.in`)"
      - "traefik.http.services.netguard-backend.loadbalancer.server.port=7000"
      - "traefik.docker.network=proxy"

  frontend:
    image: ghcr.io/nandhakumar-io/netguard-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netguard-frontend.rule=Host(`netguard.notoriousdev.in`)"
      - "traefik.http.services.netguard-frontend.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netguard-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netguard-internal

volumes:
  netguard_pgdata:
  netguard_backups_data:
  netguard_firmware_data:

networks:
  proxy:
    external: true
  netguard-internal: