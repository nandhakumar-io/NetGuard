services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Runs the deployment pipeline tasks enqueued by POST
    # /change-requests/{id}/approve (see app/tasks.py). `--concurrency`
    # controls how many devices can deploy in parallel per worker process
    # (SRS 6.6); scale by running multiple `worker` replicas for more.
    #
    # MUST list every queue app/celery_app.py's task_routes sends work to
    # (celery,polling,deploy,firmware,discovery,notifications). Celery
    # workers only consume the bare "celery" queue by default when no -Q
    # is given -- this compose file was missing it (root docker-compose.yaml
    # already had it right), so anything routed to a dedicated queue,
    # including every Network Discovery scan (app.tasks.run_network_discovery_scan_task
    # -> "discovery" queue), was enqueued in Redis but never consumed:
    # the task just sat there until the 5-minute scan timeout fired and
    # the UI reported "Scan did not complete in time (worker likely never
    # picked it)" -- which is exactly what was happening, on every scan.
    command: celery -A app.celery_app.celery_app worker -Q celery,polling,deploy,firmware,discovery,notifications --loglevel=info --concurrency=4
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  netguard_pgdata: