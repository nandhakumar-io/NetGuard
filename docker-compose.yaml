    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  frontend:
    image: ghcr.io/nandhakumar-io/netguard-frontend:${FRONTEND_TAG}
