services:
  backend:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - netguard-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netguard-backend.rule=Host(`netguard-api.notoriousdev.in`)"
      - "traefik.http.services.netguard-backend.loadbalancer.server.port=7001"
      - "traefik.docker.network=proxy"

  # Deployment pipeline / drift / compliance-report / snapshot-retention
  # tasks -- everything EXCEPT SNMP/reachability polling, which is routed
  # to the `polling` queue (see task_routes in app/celery_app.py) and
  # consumed only by the `poller` service below. Kept separate so a poll
  # storm across a large fleet can never starve a change-request
  # deployment of worker capacity, or vice versa. Stateless and safe to
  # run at any replica count: `docker compose up -d --scale worker=3`.
  worker:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "-Q", "celery", "--concurrency=4"]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netguard-internal

  # Discovery at Scale: the ONLY consumer of the `polling` queue, i.e.
  # every SNMP + reachability poll task. `--concurrency` hard-caps how
  # many devices this process probes at once, independent of fleet size
  # -- without it, a beat-triggered sweep across hundreds of due devices
  # fans out hundreds of simultaneous SNMP walks/pings in one burst
  # against the management network and the DB connection pool. Combined
  # with the per-device interval due-check and jitter in
  # app.tasks.run_snmp_poll_sweep_task / run_reachability_sweep_task,
  # this is what makes polling scale past a handful of lab devices: only
  # devices actually due get enqueued, enqueue times are spread out, and
  # however many land in the queue at once, only POLLER_CONCURRENCY are
  # ever probed in parallel. Tune POLLER_CONCURRENCY (in .env) to the
  # management network's realistic concurrent-probe budget, and scale
  # replicas (`docker compose up -d --scale poller=3`) for more
  # throughput instead of raising concurrency arbitrarily on one process.
  poller:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
      [
        "celery", "-A", "app.celery_app", "worker",
        "--loglevel=info",
        "-Q", "polling",
        "--concurrency=${POLLER_CONCURRENCY:-10}",
        "--hostname=poller@%h",
      ]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netguard-internal

  # Schedules the recurring tasks in app/celery_app.py's beat_schedule
  # (SNMP/reachability polling, nightly drift sweep, compliance reports,
  # snapshot retention). Uses RedBeat (see app/celery_app.py) so the
  # schedule and the "who's active" lock both live in Redis instead of a
  # local file -- that's what makes it safe to run more than one replica
  # here. A single file-backed beat process is a SPOF: kill that one
  # container and nothing fires again until a human restarts it. With
  # RedBeat, run this at replica count 2+ (`docker compose up -d --scale
  # beat=2`) and losing any one replica just means the Redis lock expires
  # (redbeat_lock_timeout, currently 90s) and the next replica picks up
  # scheduling automatically -- no manual failover, no duplicated tasks.
  beat:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "-S", "redbeat.RedBeatScheduler"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netguard-internal
    deploy:
      # Only honored under `docker stack deploy` (Swarm mode). Under plain
      # `docker compose up`, scale beat explicitly instead:
      #   docker compose up -d --scale beat=2
      replicas: 2

  frontend:
    image: ghcr.io/nandhakumar-io/netguard-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netguard-frontend.rule=Host(`netguard.notoriousdev.in`)"
      - "traefik.http.services.netguard-frontend.loadbalancer.server.port=6001"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netguard-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netguard-internal

volumes:
  netguard_pgdata:
  netguard_backups_data:
  netguard_firmware_data:

networks:
  proxy:
    external: true
  netguard-internal: