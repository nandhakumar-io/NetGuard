    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - worker
    - -Q
    - celery
    - --loglevel=info
    - --concurrency=4
    - --hostname=worker@%h
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NATS_URL: nats://${NATS_API_USER:-api}:${NATS_API_PASSWORD}@nats:4222
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    cap_add:
    - NET_RAW
    - NET_ADMIN
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - netguard-internal
  notifier:
    image: ghcr.io/nandhakumar-io/netguard-backend:${BACKEND_TAG}
    restart: unless-stopped
    command:
    - celery
    - -A
    - app.celery_app.celery_app
    - worker
    - -Q
    - notify
    - --loglevel=info
    - --concurrency=16
    - --hostname=notifier@%h
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://netguard_app:${NETGUARD_APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
