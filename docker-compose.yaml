services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    ports:
      - "5432:5432"
    volumes:
      - netguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Single all-in-one worker for local/dev use -- the production
    # docker-compose.yaml at the repo root splits this into dedicated
    # `poller`/`deployer`/`firmware`/`discovery`/`notifications`/`worker`
    # services, each consuming its own queue (see that file and
    # app/celery_app.py's task_routes) so heavy traffic on one never
    # delays another. Here, one worker explicitly consumes every queue
    # (including the default "celery" queue, via the bare `-Q celery`)
    # so nothing enqueued in dev silently sits unconsumed. `--concurrency`
    # controls how many tasks run in parallel per worker process (SRS
    # 6.6); scale by running multiple `worker` replicas for more.
    command: celery -A app.celery_app.celery_app worker -Q celery,polling,deploy,firmware,discovery,notifications --loglevel=info --concurrency=4
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard}@db:5432/${POSTGRES_DB:-netguard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  netguard_pgdata: