      VICTORIAMETRICS_URL: http://victoriametrics:8428
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
